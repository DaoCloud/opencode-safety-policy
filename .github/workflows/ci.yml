name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      opencode-version:
        description: OpenCode version for the E2E and system deployment tests
        type: string
        default: "2.4.1"

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  e2e:
    name: E2E (OpenCode ${{ inputs.opencode-version || '2.4.1' }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    env:
      # nightly.yml passes the latest OpenCode release. Other runs use the version the plugin is verified against.
      OPENCODE_VERSION: ${{ inputs.opencode-version || '2.4.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: npm install -g "@opencode/cli@$OPENCODE_VERSION"
      - run: opencode --version
      # macOS answers only 127.0.0.1 on loopback, and the tests serve a protected endpoint on 127.0.0.2.
      - if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - run: bun run test:e2e

  system:
    name: System deployment (OpenCode ${{ inputs.opencode-version || '2.4.1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_VERSION: ${{ inputs.opencode-version || '2.4.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: npm install -g "@opencode/cli@$OPENCODE_VERSION"
      - run: opencode --version
      - run: bun run test:system
