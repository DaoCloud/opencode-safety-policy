name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  e2e:
    name: E2E (OpenCode ${{ github.event_name == 'schedule' && 'latest' || '2.4.1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nightly runs track the latest OpenCode release; other runs use the version the plugin is verified against.
      OPENCODE_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '2.4.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: npm install -g "@opencode/cli@$OPENCODE_VERSION"
      - run: opencode --version
      - run: bun run test:e2e

  system:
    name: System deployment (OpenCode ${{ github.event_name == 'schedule' && 'latest' || '2.4.1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '2.4.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: npm install -g "@opencode/cli@$OPENCODE_VERSION"
      - run: opencode --version
      - run: bun run test:system
